name: P99Smoke
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  P99Smoke:
    type: bundle.ui-testing
    platform: iOS
    sources: [P99Smoke.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rmyou.p99mobile.smoke
schemes:
  P99Smoke:
    build:
      targets:
        P99Smoke: [test]
    test:
      targets: [P99Smoke]
