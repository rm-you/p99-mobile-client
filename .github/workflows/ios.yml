name: iOS checks

on:
  push:
    # The development branch can exercise hosted Macs before a PR is opened.
    branches: [main, codex/ios-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install build prerequisites
        run: |
          xcodebuild -version
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          command -v xcodegen || brew install xcodegen
          npm ci
      - name: Build complete Simulator application
        run: |
          npm run tauri -- ios init --ci
          npm run tauri -- ios build --ci --target aarch64-sim --no-sign
      - name: Launch the packaged app
        run: python3 scripts/ios_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-${{ github.sha }}
          path: ios-test-output/
          if-no-files-found: warn
          retention-days: 7
