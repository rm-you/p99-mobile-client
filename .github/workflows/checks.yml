name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Commit to check for a release retry
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify original item snapshot
        run: python3 scripts/import_items.py --check
      - name: Test release validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust components
        run: |
          rustup show active-toolchain
          rustc --version
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check Android library
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          cargo clippy --locked --workspace --target aarch64-linux-android --lib -- -D warnings
      - name: Build Android APK including native plugins
        working-directory: .
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npm run tauri -- android init --ci
          npm run tauri -- android build --debug --target aarch64 --apk
